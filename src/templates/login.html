<!DOCTYPE html>
<html>
<head>
    <title>Login/Register</title>
    <link rel="stylesheet" href="{{ app_url('static/css/main.css') }}">
</head>
<body class="center-page">
    <div class="form-card">
        <h1>Login/Register</h1>
        {% if error_message %}
            <div class="server-error">{{ error_message }}</div>
        {% endif %}
        <form method="POST" action="{{ app_url('login') }}">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="{{ register_username or '' }}" required><br>
            <p id="registerHint" class="register-hint">This username does not exist. This login will register a new account.</p>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br>

            <div id="confirmPasswordContainer" class="confirm-password-container">
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password"><br>
                <p id="passwordError" class="error-hint">Passwords do not match.</p>
            </div>

            <input type="submit" class="button" value="Login">
        </form>
    </div>
    <script>
        const APP_BASE_PATH = '{{ app_base_path }}';
        const appUrl = (path) => `${APP_BASE_PATH}/${path}`;
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        const confirmPasswordContainer = document.getElementById('confirmPasswordContainer');
        const registerHint = document.getElementById('registerHint');
        const passwordError = document.getElementById('passwordError');
        const form = document.querySelector('form');
        let isRegistering = Boolean('{{ register_username or "" }}');

        function setRegisterMode(enabled) {
            isRegistering = enabled;
            registerHint.style.display = enabled ? 'block' : 'none';
            confirmPasswordContainer.style.display = enabled ? 'block' : 'none';
            confirmPasswordInput.required = enabled;
            if (!enabled) {
                confirmPasswordInput.value = '';
                passwordError.style.display = 'none';
            }
        }

        async function checkUsername() {
            const username = usernameInput.value.trim();
            if (!username) {
                setRegisterMode(false);
                return;
            }

            const response = await fetch(`${appUrl('check_username')}?username=${encodeURIComponent(username)}`);
            const result = await response.json();
            setRegisterMode(result.valid && !result.exists);
        }

        usernameInput.addEventListener('blur', checkUsername);
        usernameInput.addEventListener('change', checkUsername);

        if (isRegistering) {
            setRegisterMode(true);
        }

        form.addEventListener('submit', function(event) {
            if (isRegistering && passwordInput.value !== confirmPasswordInput.value) {
                event.preventDefault();
                passwordError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
